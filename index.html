    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #FFE4E1 0%, #FFF0F5 100%);
            min-height: 100vh;
            color: #5D3A21;
            user-select: none;
            -webkit-user-select: none;
        }
        .container { max-width: 1450px; margin: 0 auto; padding: 15px; }
        
        .navbar {
            background: rgba(255, 255, 255, 0.96);
            padding: 15px 30px;
            border-radius: 24px;
            border-bottom: 4px solid #FFB6C1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px rgba(255,182,193,0.3);
        }
        .score-badge {
            background: linear-gradient(135deg, #FFF0F5, #FFE4E1);
            padding: 10px 25px;
            border-radius: 30px;
            border: 2px solid #FF69B4;
            font-weight: 900;
            font-size: 18px;
            color: #FF1493;
        }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 15px;
        }
        @media(min-width: 1050px) {
            .game-grid { grid-template-columns: 1.32fr 1fr; }
        }

        /* 舞台 */
        .stage-card {
            background: linear-gradient(180deg, #FFFFFF 0%, #FFFDF9 70%, #FFF0F5 100%);
            border: 5px solid #FFB6C1;
            border-radius: 36px;
            height: 720px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        /* 宠物核心容器 */
        .pet-container {
            position: absolute;
            bottom: 350px;
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            height: 260px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .stage-baby { font-size: 110px; }       
        .stage-growing { font-size: 160px; }    
        .stage-king { font-size: 210px; }       

        /* 🌟 进化特效光圈 */
        @keyframes evolvePulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 105, 180, 0.7); transform: translateX(-50%) scale(1); }
            50% { box-shadow: 0 0 30px 20px rgba(255, 20, 147, 0); transform: translateX(-50%) scale(1.3); }
            100% { box-shadow: 0 0 0 0 rgba(255, 105, 180, 0); transform: translateX(-50%) scale(1); }
        }
        .evolving {
            animation: evolvePulse 1.2s ease-in-out;
            border-radius: 50%;
        }

        .draggable-item {
            position: absolute;
            width: 90px;
            height: 90px;
            font-size: 68px;
            text-align: center;
            line-height: 90px;
            cursor: move;
            z-index: 40; 
            user-select: none;
            touch-action: none;
            box-sizing: border-box;
        }
        .draggable-item:hover, .draggable-item.active-target {
            outline: 3px dashed #FF69B4;
            background: rgba(255,192,203,0.2);
            border-radius: 20px;
            z-index: 99;
        }

        .storage-zone {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            height: 100px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            z-index: 5;
        }
        .storage-box {
            background: rgba(255, 255, 255, 0.88);
            border: 2px dashed #FFB6C1;
            border-radius: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .storage-box::before {
            content: attr(data-label);
            font-size: 13px;
            font-weight: bold;
            color: #C71585;
            background: #FFF0F5;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid #FFB6C1;
        }

        .transform-controls {
            position: absolute;
            bottom: 130px;
            right: 15px;
            background: rgba(255, 255, 255, 0.98);
            border: 2px solid #FF69B4;
            border-radius: 18px;
            padding: 10px 16px;
            display: none;
            gap: 8px;
            z-index: 200;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            align-items: center;
        }
        .transform-controls span { font-size: 13px; font-weight: bold; color: #C71585; margin-right: 4px;}
        .transform-controls button {
            background: #FFF0F5;
            border: 1px solid #FFB6C1;
            border-radius: 10px;
            padding: 5px 12px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            color: #C71585;
        }
        .transform-controls button:hover { background: #FF1493; color: white; border-color: #FF1493; }

        /* 百货商店 */
        .shop-card {
            background: white;
            border: 4px solid #FFB6C1;
            border-radius: 36px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 720px;
            box-sizing: border-box;
        }
        .shop-tabs {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 12px;
        }
        .tab-btn {
            background: #FFF0F5;
            border: 2px solid #FFE4E1;
            padding: 10px 1px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            color: #C71585;
            text-align: center;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #FF69B4, #FF1493);
            color: white;
            border-color: #FF1493;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            overflow-y: auto;
            flex: 1;
        }
        .items-grid::-webkit-scrollbar { width: 6px; }
        .items-grid::-webkit-scrollbar-thumb { background-color: #FFB6C1; border-radius: 10px; }

        .product-box {
            border: 2px solid #FFF5F7;
            padding: 8px 4px;
            border-radius: 18px;
            text-align: center;
            background: #FFFDFE;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .btn-buy {
            background: linear-gradient(135deg, #FF69B4, #FF1493);
            color: white;
            border: none;
            padding: 6px 4px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
            margin-top: 5px;
            font-weight: bold;
        }
        .btn-buy:disabled { background: #E0E0E0; cursor: not-allowed; color: #999; }

        .adopt-card {
            background: white;
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            border-radius: 36px;
            border: 4px solid #FFB6C1;
            text-align: center;
            box-shadow: 0 15px 40px rgba(255,182,193,0.2);
        }
        .select-matrix {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }
        .opt-card {
            border: 3px dashed #FFE4E1;
            padding: 20px;
            border-radius: 24px;
            cursor: pointer;
            background: #FFFDFE;
        }
        .opt-card.selected {
            border: 3px solid #FF1493;
            background: #FFF0F5;
            transform: scale(1.05);
        }

        .chat-bubble {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.96);
            border: 2px solid #FFB6C1;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: bold;
            min-width: 360px;
            text-align: center;
            z-index: 30;
            box-shadow: 0 6px 20px rgba(255,182,193,0.25);
        }

            background: #FFE4E1;
            border: 1px solid #FFB6C1;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 11px;
            color: #C71585;
            margin-top: 4px;
            display: inline-block;

    </style>
</head>

        // ======= 3. Firebase 数据同步流与监听 =======
        db.ref('gameState').on('value', (snap) => {
            const data = snap.val();
            if (snap.exists() && data) {
                activeState = data;
                if (!activeState.stageItems) activeState.stageItems = [];
            } else {
                activeState = JSON.parse(JSON.stringify(cleanState));
                db.ref('gameState').set(activeState);
            }
            updateCoreUI();
        });

        // ======= 4. 界面主同步渲染逻辑 =======
        function updateCoreUI() {
            document.getElementById('textPoints').innerText = activeState.points;

            if (!activeState.hasPet) {
                document.getElementById('adoptSection').style.display = 'block';
                document.getElementById('petMainSection').style.display = 'none';
                return;
            } else {
                document.getElementById('adoptSection').style.display = 'none';
                document.getElementById('petMainSection').style.display = 'grid';
            }

            document.getElementById('textPetName').innerText = activeState.petName;
            document.getElementById('textPetType').innerText = `(${cnNameMap[activeState.petType]})`;
            document.getElementById('textFedCount').innerText = `已投喂: ${activeState.fedCount} 次`;

            // 🌟 核心进化阈值：20次/50次 逻辑形态绑定
            const petEl = document.getElementById('spritePet');
            petEl.className = 'pet-container'; 
            
            let currentStageLabel = '';
            if (activeState.fedCount >= 50) {
                activeState.growthStage = 'king';
                currentStageLabel = '👑 终极炫酷萌王';
                petEl.classList.add('stage-king');
            } else if (activeState.fedCount >= 20) {
                activeState.growthStage = 'growing';
                currentStageLabel = '🦖 青年成长巨兽';
                petEl.classList.add('stage-growing');
            } else {
                activeState.growthStage = 'baby';
                currentStageLabel = '👶 软萌幼崽期';
                petEl.classList.add('stage-baby');
            }
            document.getElementById('textGrowthStage').innerText = currentStageLabel;
            petEl.innerText = spriteMatrix[activeState.petType] || '🐰';

            renderShopGrid();
            renderStageItems();
        }

        function renderShopGrid() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            const filtered = globalShopCatalog.filter(item => item.category === currentTab);
            
            filtered.forEach(product => {
                const canBuy = activeState.points >= product.cost;
                grid.innerHTML += `
                    <div class="product-box">
                        <span style="font-size:38px; margin-top:5px;">${product.icon}</span>
                        <b style="font-size:12px; color:#5D3A21; display:block; margin:4px 0;">${product.name}</b>
                        <span style="font-size:11px; font-weight:bold; color:#FF1493;">⭐ ${product.cost} 分</span>
                        <button class="btn-buy" ${canBuy ? '' : 'disabled'} onclick="purchaseProduct('${product.id}')">购买派发</button>
                    </div>
                `;
            });
        }

        function switchShopTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            renderShopGrid();
        }

        // ======= 5. 领养逻辑互动 =======
        function clickPetCard(type) {
            selectedType = type;
            document.querySelectorAll('.opt-card').forEach(card => card.classList.remove('selected'));
            document.getElementById(`item-${type}`).classList.add('selected');
        }

        function executeAdopt() {
            if (!selectedType) {
                alert("请先用手指点击挑选一个您喜欢的宠物蛋！🥚");
                return;
            }
            const nameInput = document.getElementById('inputPetName').value.trim();
            if (!nameInput) {
                alert("快给您的萌宠宝宝起个闪亮好听的名字吧！✍️");
                return;
            }

            activeState.hasPet = true;
            activeState.petType = selectedType;
            activeState.petName = nameInput;
            activeState.fedCount = 0;
            activeState.growthStage = 'baby';
            activeState.stageItems = [];

            db.ref('gameState').set(activeState);
        }

        // ======= 6. 购买商品逻辑 =======
        function purchaseProduct(productId) {
            const product = globalShopCatalog.find(item => item.id === productId);
            if (!product) return;

            if (activeState.points < product.cost) {
                alert("数学积分余额不足，快让老师在上方帮您赋予更多积分吧！⭐");
                return;
            }

            activeState.points -= product.cost;

            const newItem = {
                id: product.id,
                icon: product.icon,
                category: product.category,
                x: 120 + Math.random() * 100,
                y: 150 + Math.random() * 100,
                scale: 1.0,
                rotate: 0
            };

            if (!activeState.stageItems) activeState.stageItems = [];
            activeState.stageItems.push(newItem);

            db.ref('gameState').set(activeState);
            triggerBubbleTalk(`成功派发了 [${product.name}]，快把它拖拽到合适的位置或用来喂我吧！`);
        }

        // ======= 7. 3D渲染与拖拽交互（支持手机/PC端） =======
        function renderStageItems() {
            const canvas = document.getElementById('stageCanvas');
            document.querySelectorAll('.draggable-item').forEach(el => el.remove());

            if (!activeState.stageItems) return;

            activeState.stageItems.forEach((item, idx) => {
                const itemEl = document.createElement('div');
                itemEl.className = 'draggable-item';
                if (idx === selectedElementIdx) itemEl.classList.add('active-target');
                itemEl.innerText = item.icon;
                itemEl.style.left = item.x + 'px';
                itemEl.style.top = item.y + 'px';
                itemEl.style.transform = `scale(${item.scale || 1}) rotate(${item.rotate || 0}deg)`;

                itemEl.addEventListener('mousedown', (e) => initDrag(e, idx));
                itemEl.addEventListener('touchstart', (e) => initDrag(e.touches[0], idx), { passive: false });

                canvas.appendChild(itemEl);
            });
        }

        function initDrag(e, idx) {
            isDragging = true;
            localDragIdx = idx;
            selectedElementIdx = idx; 

            const item = activeState.stageItems[idx];
            dragOffsetX = e.clientX - item.x;
            dragOffsetY = e.clientY - item.y;

            document.getElementById('transformControls').style.display = 'flex';

            document.addEventListener('mousemove', dragMove);
            document.addEventListener('touchmove', dragMoveTouch, { passive: false });
            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('touchend', dragEnd);
        }

        function dragMove(e) {
            if (!isDragging || localDragIdx === -1) return;
            const item = activeState.stageItems[localDragIdx];
            item.x = e.clientX - dragOffsetX;
            item.y = e.clientY - dragOffsetY;

            const el = document.querySelectorAll('.draggable-item')[localDragIdx];
            if (el) {
                el.style.left = item.x + 'px';
                el.style.top = item.y + 'px';
            }
        }

        function dragMoveTouch(e) {
            if (e.cancelable) e.preventDefault();
            dragMove(e.touches[0]);
        }

        function dragEnd(e) {
            if (!isDragging || localDragIdx === -1) return;
            isDragging = false;

            let finalX = activeState.stageItems[localDragIdx].x;
            let finalY = activeState.stageItems[localDragIdx].y;
            const currentItem = activeState.stageItems[localDragIdx];

            // 判定是否拖入宠物口中喂食
            if (currentItem.category === 'food' || currentItem.category === 'drink') {
                const petEl = document.getElementById('spritePet');
                const petRect = petEl.getBoundingClientRect();
                const stageRect = document.getElementById('stageCanvas').getBoundingClientRect();

                const targetLeft = petRect.left - stageRect.left;
                const targetRight = petRect.right - stageRect.left;
                const targetTop = petRect.top - stageRect.top;
                const targetBottom = petRect.bottom - stageRect.top;

                if (finalX >= targetLeft - 40 && finalX <= targetRight + 40 && finalY >= targetTop - 40 && finalY <= targetBottom + 40) {
                    activeState.fedCount += 1;
                    activeState.stageItems.splice(localDragIdx, 1); 
                    selectedElementIdx = -1;
                    document.getElementById('transformControls').style.display = 'none';

                    // 触发 20次 或 50次 形态进化全屏光圈
                    if (activeState.fedCount === 20 || activeState.fedCount === 50) {
                        petEl.classList.add('evolving');
                        setTimeout(() => petEl.classList.remove('evolving'), 1200);
                        triggerBubbleTalk("⭐ 奇迹发生！我身上的数学能量爆发，形态进化了！！");
                    } else {
                        const randomQuotes = quoteMatrix[activeState.growthStage] || quoteMatrix['baby'];
                        const textSelected = randomQuotes[Math.floor(Math.random() * randomQuotes.length)];
                        triggerBubbleTalk(textSelected);
                    }

                    localDragIdx = -1;
                    db.ref('gameState').set(activeState);
                    return;
                }
            }

            // 判定是否拖入三个分类收纳箱
            const checkStorageBoxes = ['fridge', 'closet', 'cabinet'];
            for (let boxId of checkStorageBoxes) {
                const boxEl = document.getElementById(`box-${boxId}`);
                if (boxEl) {
                    const boxRect = boxEl.getBoundingClientRect();
                    const stageRect = document.getElementById('stageCanvas').getBoundingClientRect();
                    const bLeft = boxRect.left - stageRect.left;
                    const bRight = boxRect.right - stageRect.left;
                    const bTop = boxRect.top - stageRect.top;
                    const bBottom = boxRect.bottom - stageRect.top;

                    if (finalX >= bLeft && finalX <= bRight && finalY >= bTop && finalY <= bBottom) {
                        activeState.stageItems.splice(localDragIdx, 1);
                        selectedElementIdx = -1;
                        document.getElementById('transformControls').style.display = 'none';
                        triggerBubbleTalk(`成功将组件整理收纳进盒子里了！🧹`);
                        localDragIdx = -1;
                        db.ref('gameState').set(activeState);
                        return;
                    }
                }
            }

            db.ref('gameState').set(activeState);
            localDragIdx = -1;
            
            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('touchmove', dragMoveTouch);
        }

        // ======= 8. 3D缩放、旋转及移除控制 =======
        function adjustItemScale(ratio) {
            if (selectedElementIdx === -1 || !activeState.stageItems[selectedElementIdx]) return;
            let currentScale = activeState.stageItems[selectedElementIdx].scale || 1.0;
            currentScale *= ratio;
            if (currentScale < 0.4) currentScale = 0.4;
            if (currentScale > 3.5) currentScale = 3.5;
            
            activeState.stageItems[selectedElementIdx].scale = currentScale;
            db.ref('gameState').set(activeState);
        }

        function adjustItemRotate(degree) {
            if (selectedElementIdx === -1 || !activeState.stageItems[selectedElementIdx]) return;
            let currentRotate = activeState.stageItems[selectedElementIdx].rotate || 0;
            currentRotate = (currentRotate + degree) % 360;
            
            activeState.stageItems[selectedElementIdx].rotate = currentRotate;
            db.ref('gameState').set(activeState);
        }

        function deleteActiveItem() {
            if (selectedElementIdx === -1 || !activeState.stageItems[selectedElementIdx]) return;
            activeState.stageItems.splice(selectedElementIdx, 1);
            selectedElementIdx = -1;
            document.getElementById('transformControls').style.display = 'none';
            db.ref('gameState').set(activeState);
        }

        function clearStageItems() {
            if (confirm("确定要一件不留地清空舞台上的所有道具和装饰品吗？🧹")) {
                activeState.stageItems = [];
                selectedElementIdx = -1;
                document.getElementById('transformControls').style.display = 'none';
                db.ref('gameState').set(activeState);
            }
        }

        function triggerBubbleTalk(msg) {
            document.getElementById('uiBubble').innerText = msg;
        }

        // ======= 9. 🧙‍♂️ 老师云端超级控制台 =======
        function toggleRolePanel() {
            const role = document.getElementById('roleSelect').value;
            document.getElementById('teacherPanel').style.display = (role === 'teacher') ? 'block' : 'none';
        }

        function commitPointsByTeacher() {
            const val = parseInt(document.getElementById('inputTeacherPoints').value);
            if (isNaN(val)) {
                alert("请输入合法的正整数分数值！✍️");
                return;
            }
            activeState.points = val;
            db.ref('gameState').set(activeState);
            alert(`🧙‍♂️ 教师同步赋分成功！目前数学积分已被重置设为：${val} 分`);
        }

        function wipeCloudAndRestart() {
            if (confirm("💥 警告：该操作将清空所有云端联机数据、重置积分及重置所有宠物形态！确定格式化吗？")) {
                selectedElementIdx = -1;
                document.getElementById('transformControls').style.display = 'none';
                db.ref('gameState').set(cleanState);
            }
        }
    </script>
</body>
</html>
