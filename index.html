    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #FFE4E1 0%, #FFF0F5 100%);
            min-height: 100vh;
            color: #5D3A21;
            user-select: none;
            -webkit-user-select: none;
        }
        .container { max-width: 1450px; margin: 0 auto; padding: 15px; }
        
        .navbar {
            background: rgba(255, 255, 255, 0.96);
            padding: 15px 30px;
            border-radius: 24px;
            border-bottom: 4px solid #FFB6C1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px rgba(255,182,193,0.3);
        }
        .score-badge {
            background: linear-gradient(135deg, #FFF0F5, #FFE4E1);
            padding: 10px 25px;
            border-radius: 30px;
            border: 2px solid #FF69B4;
            font-weight: 900;
            font-size: 18px;
            color: #FF1493;
        }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 15px;
        }
        @media(min-width: 1050px) {
            .game-grid { grid-template-columns: 1.32fr 1fr; }
        }

        /* 舞台 */
        .stage-card {
            background: linear-gradient(180deg, #FFFFFF 0%, #FFFDF9 70%, #FFF0F5 100%);
            border: 5px solid #FFB6C1;
            border-radius: 36px;
            height: 720px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        /* 宠物核心容器 */
        .pet-container {
            position: absolute;
            bottom: 350px;
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            height: 260px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .stage-baby { font-size: 110px; }       
        .stage-growing { font-size: 160px; }    
        .stage-king { font-size: 210px; }       

        /* 🌟 进化特效光圈 */
        @keyframes evolvePulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 105, 180, 0.7); transform: translateX(-50%) scale(1); }
            50% { box-shadow: 0 0 30px 20px rgba(255, 20, 147, 0); transform: translateX(-50%) scale(1.3); }
            100% { box-shadow: 0 0 0 0 rgba(255, 105, 180, 0); transform: translateX(-50%) scale(1); }
        }
        .evolving {
            animation: evolvePulse 1.2s ease-in-out;
            border-radius: 50%;
        }

        .draggable-item {
            position: absolute;
            width: 90px;
            height: 90px;
            font-size: 68px;
            text-align: center;
            line-height: 90px;
            cursor: move;
            z-index: 40; 
            user-select: none;
            touch-action: none;
            box-sizing: border-box;
        }
        .draggable-item:hover, .draggable-item.active-target {
            outline: 3px dashed #FF69B4;
            background: rgba(255,192,203,0.2);
            border-radius: 20px;
            z-index: 99;
        }

        .storage-zone {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            height: 100px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            z-index: 5;
        }
        .storage-box {
            background: rgba(255, 255, 255, 0.88);
            border: 2px dashed #FFB6C1;
            border-radius: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .storage-box::before {
            content: attr(data-label);
            font-size: 13px;
            font-weight: bold;
            color: #C71585;
            background: #FFF0F5;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid #FFB6C1;
        }

        .transform-controls {
            position: absolute;
            bottom: 130px;
            right: 15px;
            background: rgba(255, 255, 255, 0.98);
            border: 2px solid #FF69B4;
            border-radius: 18px;
            padding: 10px 16px;
            display: none;
            gap: 8px;
            z-index: 200;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            align-items: center;
        }
        .transform-controls span { font-size: 13px; font-weight: bold; color: #C71585; margin-right: 4px;}
        .transform-controls button {
            background: #FFF0F5;
            border: 1px solid #FFB6C1;
            border-radius: 10px;
            padding: 5px 12px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            color: #C71585;
        }
        .transform-controls button:hover { background: #FF1493; color: white; border-color: #FF1493; }

        /* 百货商店 */
        .shop-card {
            background: white;
            border: 4px solid #FFB6C1;
            border-radius: 36px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 720px;
            box-sizing: border-box;
        }
        .shop-tabs {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 12px;
        }
        .tab-btn {
            background: #FFF0F5;
            border: 2px solid #FFE4E1;
            padding: 10px 1px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            color: #C71585;
            text-align: center;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #FF69B4, #FF1493);
            color: white;
            border-color: #FF1493;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            overflow-y: auto;
            flex: 1;
        }
        .items-grid::-webkit-scrollbar { width: 6px; }
        .items-grid::-webkit-scrollbar-thumb { background-color: #FFB6C1; border-radius: 10px; }

        .product-box {
            border: 2px solid #FFF5F7;
            padding: 8px 4px;
            border-radius: 18px;
            text-align: center;
            background: #FFFDFE;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .btn-buy {
            background: linear-gradient(135deg, #FF69B4, #FF1493);
            color: white;
            border: none;
            padding: 6px 4px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
            margin-top: 5px;
            font-weight: bold;
        }
        .btn-buy:disabled { background: #E0E0E0; cursor: not-allowed; color: #999; }

        .adopt-card {
            background: white;
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            border-radius: 36px;
            border: 4px solid #FFB6C1;
            text-align: center;
            box-shadow: 0 15px 40px rgba(255,182,193,0.2);
        }
        .select-matrix {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }
        .opt-card {
            border: 3px dashed #FFE4E1;
            padding: 20px;
            border-radius: 24px;
            cursor: pointer;
            background: #FFFDFE;
        }
        .opt-card.selected {
            border: 3px solid #FF1493;
            background: #FFF0F5;
            transform: scale(1.05);
        }

        .chat-bubble {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.96);
            border: 2px solid #FFB6C1;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: bold;
            min-width: 360px;
            text-align: center;
            z-index: 30;
            box-shadow: 0 6px 20px rgba(255,182,193,0.25);

            border: 1px solid #FFB6C1;

            border-radius: 10px;
            font-size: 11px;
            color: #C71585;
            margin-top: 4px;
            display: inline-block;

        // ======= 3. Firebase 数据同步流 =======
        db.ref('gameState').on('value', (snap) => {
            const data = snap.val();
            if (data) {
                activeState = data;
                if (!activeState.stageItems) activeState.stageItems = [];
                if (!activeState.fedCount) activeState.fedCount = 0;
                if (!activeState.growthStage) activeState.growthStage = 'baby';
                if (!isDragging) {
                    compileDOM();
                } else {
                    document.getElementById('textPoints').innerText = activeState.points;
                }
            } else {
                db.ref('gameState').set(cleanState);
            }
        });

        function compileDOM() {
            document.getElementById('textPoints').innerText = activeState.points;
            document.getElementById('inputTeacherPoints').value = activeState.points;

            if (activeState.hasPet) {
                document.getElementById('adoptSection').style.display = 'none';
                document.getElementById('petMainSection').style.display = 'grid';
                
                document.getElementById('textPetName').innerText = activeState.petName;
                document.getElementById('textPetType').innerText = `【${cnNameMap[activeState.petType] || '萌宠'}】`;
                document.getElementById('spritePet').innerText = spriteMatrix[activeState.petType] || '🐰';
                
                document.getElementById('textFedCount').innerText = `已投喂: ${activeState.fedCount} 次`;
                
                const stageEl = document.getElementById('textGrowthStage');
                const petSprite = document.getElementById('spritePet');
                
                petSprite.className = 'pet-container';
                if (activeState.growthStage === 'baby') {
                    stageEl.innerText = '👶 幼崽形态';
                    stageEl.style.color = '#FFFF00';
                    petSprite.classList.add('stage-baby');
                } else if (activeState.growthStage === 'growing') {
                    stageEl.innerText = '🦖 青年形态';
                    stageEl.style.color = '#00FFFF';
                    petSprite.classList.add('stage-growing');
                } else if (activeState.growthStage === 'king') {
                    stageEl.innerText = '👑 究极体圣兽';
                    stageEl.style.color = '#FFD700';
                    petSprite.classList.add('stage-king');
                }

                syncStageItemsDOM();
            } else {
                document.getElementById('adoptSection').style.display = 'block';
                document.getElementById('petMainSection').style.display = 'none';
            }
            renderShopWindow();
        }

        // ======= 4. 物品拖拽与全新进化线触发算法 =======
        function syncStageItemsDOM() {
            const canvas = document.getElementById('stageCanvas');
            document.querySelectorAll('.draggable-item').forEach(el => el.remove());

            activeState.stageItems.forEach((item, index) => {
                const node = document.createElement('div');
                node.className = 'draggable-item';
                node.id = `item-node-${index}`;
                node.innerText = item.icon;
                
                node.style.left = item.x + 'px';
                node.style.top = item.y + 'px';
                node.style.transform = `scale(${item.scale || 1}) rotate(${item.rotate || 0}deg)`;

                if (localDragIdx === index) {
                    node.classList.add('active-target');
                }

                const startDrag = (clientX, clientY) => {
                    activateItemFocus(index, node);
                    isDragging = true;
                    const rect = canvas.getBoundingClientRect();
                    dragOffsetX = (clientX - rect.left) - node.offsetLeft;
                    dragOffsetY = (clientY - rect.top) - node.offsetTop;
                };

                node.addEventListener('mousedown', (e) => { startDrag(e.clientX, e.clientY); e.stopPropagation(); });
                node.addEventListener('touchstart', (e) => { const t = e.touches[0]; startDrag(t.clientX, t.clientY); e.stopPropagation(); }, { passive: true });

                canvas.appendChild(node);
            });
        }

        function activateItemFocus(index, node) {
            localDragIdx = index;
            document.querySelectorAll('.draggable-item').forEach(el => el.classList.remove('active-target'));
            node.classList.add('active-target');

            const ctrl = document.getElementById('transformControls');
            ctrl.style.display = 'flex';
            ctrl.setAttribute('data-target-index', index);
            document.getElementById('ctrlTitle').innerText = `已选: ${activeState.stageItems[index].name}`;
        }

        function handleDragMoving(clientX, clientY) {
            if (!isDragging || localDragIdx === -1) return;
            const canvas = document.getElementById('stageCanvas');
            const node = document.getElementById(`item-node-${localDragIdx}`);
            if (!node || !canvas) return;

            const rect = canvas.getBoundingClientRect();
            let nextX = (clientX - rect.left) - dragOffsetX;
            let nextY = (clientY - rect.top) - dragOffsetY;

            const maxW = canvas.clientWidth - 70;
            const maxH = canvas.clientHeight - 70;
            if (nextX < -15) nextX = -15; if (nextX > maxW) nextX = maxW;
            if (nextY < -15) nextY = -15; if (nextY > maxH) nextY = maxH;

            node.style.left = nextX + 'px';
            node.style.top = nextY + 'px';

            activeState.stageItems[localDragIdx].x = nextX;
            activeState.stageItems[localDragIdx].y = nextY;
        }

        document.addEventListener('mousemove', (e) => handleDragMoving(e.clientX, e.clientY));
        document.addEventListener('touchmove', (e) => { if(isDragging) { const t = e.touches[0]; handleDragMoving(t.clientX, t.clientY); } }, { passive: true });

        function handleDragEnd() {
            if (!isDragging || localDragIdx === -1) return;
            isDragging = false;

            const canvas = document.getElementById('stageCanvas');
            const currentItem = activeState.stageItems[localDragIdx];
            
            const pctX = (currentItem.x + 45) / canvas.clientWidth;
            const pctY = (currentItem.y + 45) / canvas.clientHeight;

            // 🎯 投喂区检测：拖拽到宠物面部/身体中心点附近
            if (pctX >= 0.3 && pctX <= 0.7 && pctY >= 0.15 && pctY <= 0.55) {
                if (currentItem.category === 'food' || currentItem.category === 'drink') {
                    
                    activeState.stageItems.splice(localDragIdx, 1);
                    localDragIdx = -1;
                    document.getElementById('transformControls').style.display = 'none';
                    
                    activeState.fedCount += 1;
                    
                    // 🌟 核心修改点：满 15 次升入【青年形态】；满 30 次升入【究极体】！
                    let oldStage = activeState.growthStage;
                    let evolvedNotification = false;

                    if (activeState.fedCount >= 30) {
                        activeState.growthStage = 'king';
                    } else if (activeState.fedCount >= 15) {
                        activeState.growthStage = 'growing';
                    } else {
                        activeState.growthStage = 'baby';
                    }

                    if (oldStage !== activeState.growthStage) {
                        evolvedNotification = true;
                    }

                    db.ref('gameState').update({
                        stageItems: activeState.stageItems,
                        fedCount: activeState.fedCount,
                        growthStage: activeState.growthStage
                    });

                    const currentQuotes = quoteMatrix[activeState.growthStage];
                    let randomQuote = currentQuotes[Math.floor(Math.random() * currentQuotes.length)];
                    
                    if (evolvedNotification) {
                        const petTextStage = activeState.growthStage === 'king' ? '👑究极体圣兽形态👑' : '🦖青年形态🦖';
                        randomQuote = `✨【奇迹进化!!】由于主人的精心照料，我成功蜕变成为了 ${petTextStage} ！！`;
                        
                        const petSprite = document.getElementById('spritePet');
                        petSprite.classList.add('evolving');
                        setTimeout(() => petSprite.classList.remove('evolving'), 1200);
                    } else {
                        const petSprite = document.getElementById('spritePet');
                        petSprite.style.transform = 'translateX(-50%) scale(1.18)';
                        setTimeout(() => petSprite.style.transform = 'translateX(-50%) scale(1)', 250);
                    }

                    db.ref('petText').set(`😋 ${activeState.petName}：${randomQuote}`);
                    return;
                }
            }

            if (pctY >= 0.82) {
                let boxName = "";
                if (pctX > 0 && pctX < 0.33) { boxName = "🧊 冰冻冰箱"; } 
                else if (pctX >= 0.33 && pctX < 0.66) { boxName = "👚 梦幻衣橱"; } 
                else { boxName = "📦 萌宠收纳柜"; }
                db.ref('petText').set(`📥 哇！成功把组件【${currentItem.name}】精细化归纳到了 ${boxName} 内部！`);
            }

            db.ref('gameState/stageItems').set(activeState.stageItems);
        }

        window.addEventListener('mouseup', handleDragEnd);
        window.addEventListener('touchend', handleDragEnd);

        // ======= 5. 尺寸/角度微调控制中心 =======
        function adjustItemScale(factor) {
            const ctrl = document.getElementById('transformControls');
            const idx = ctrl.getAttribute('data-target-index');
            if (idx === null || !activeState.stageItems[idx]) return;

            let currentScale = activeState.stageItems[idx].scale || 1;
            currentScale *= factor;
            if(currentScale < 0.4) currentScale = 0.4;
            if(currentScale > 3.0) currentScale = 3.0;

            activeState.stageItems[idx].scale = currentScale;
            db.ref('gameState/stageItems').set(activeState.stageItems);
        }

        function adjustItemRotate(deg) {
            const ctrl = document.getElementById('transformControls');
            const idx = ctrl.getAttribute('data-target-index');
            if (idx === null || !activeState.stageItems[idx]) return;

            let currentRot = activeState.stageItems[idx].rotate || 0;
            currentRot = (currentRot + deg) % 360;

            activeState.stageItems[idx].rotate = currentRot;
            db.ref('gameState/stageItems').set(activeState.stageItems);
        }

        function deleteActiveItem() {
            const ctrl = document.getElementById('transformControls');
            const idx = ctrl.getAttribute('data-target-index');
            if (idx === null) return;

            activeState.stageItems.splice(idx, 1);
            localDragIdx = -1;
            ctrl.style.display = 'none';
            db.ref('gameState/stageItems').set(activeState.stageItems);
        }

        function clearStageItems() {
            localDragIdx = -1;
            document.getElementById('transformControls').style.display = 'none';
            db.ref('gameState/stageItems').set([]);
            db.ref('petText').set("🧹 整个大舞台已全部清空，去兑换新配件设计吧！");
        }

        // ======= 6. 货架分类与兑换引擎 =======
        function switchShopTab(tag) {
            currentTab = tag;
            ['food', 'drink', 'cloth', 'decor', 'furniture'].forEach(id => {
                document.getElementById(`tab-${id}`).className = 'tab-btn';
            });
            document.getElementById(`tab-${tag}`).className = 'tab-btn active';
            renderShopWindow();
        }

        function renderShopWindow() {
            const grid = document.getElementById('shopGrid');
            if (!grid) return;
            grid.innerHTML = '';

            const filteredProducts = globalShopCatalog.filter(p => p.category === currentTab);

            filteredProducts.forEach(product => {
                const canAfford = activeState.points >= product.cost;
                const node = document.createElement('div');
                node.className = 'product-box';
                
                node.innerHTML = `
                    <div style="font-size:42px; padding:2px 0;">${product.icon}</div>
                    <div style="font-size:11px; font-weight:bold; color:#5D3A21; text-overflow:ellipsis; white-space:nowrap; overflow:hidden;" title="${product.name}">${product.name}</div>
                    <div style="font-size:11px; color:#FF1493; font-weight:bold; margin:2px 0;">⭐ ${product.cost} 分</div>
                    <button class="btn-buy" onclick="buyProduct('${product.id}')" ${canAfford ? '' : 'disabled'}>兑换生成</button>
                `;
                grid.appendChild(node);
            });
        }

        function buyProduct(id) {
            const target = globalShopCatalog.find(p => p.id === id);
            if (!target || activeState.points < target.cost) return;

            activeState.points -= target.cost;
            if (!activeState.stageItems) activeState.stageItems = [];
            
            activeState.stageItems.push({
                id: target.id,
                icon: target.icon,
                name: target.name,
                category: target.category,
                x: 220, 
                y: 360, 
                scale: 1,
                rotate: 0
            });

            db.ref('gameState').update({
                points: activeState.points,
                stageItems: activeState.stageItems
            });

            db.ref('petText').set(`🎉 成功兑换【${target.name}】！快把它拖到对应位置进行穿搭或装潢吧！`);
        }

        // ======= 7. 领养初始化与控制中心 =======
        function clickPetCard(type) {
            selectedType = type;
            ['rabbit', 'puffer', 'dolphin', 'mouse', 'panda', 'husky'].forEach(id => {
                const el = document.getElementById(`item-${id}`);
                if (el) el.className = 'opt-card';
            });
            const selectedEl = document.getElementById(`item-${type}`);
            if (selectedEl) selectedEl.className = 'opt-card selected';
        }

        function executeAdopt() {
            const name = document.getElementById('inputPetName').value.trim();
            if (!selectedType) { alert('请先点击上方挑选一款萌宠！'); return; }
            if (!name) { alert('请输入宠物的昵称！'); return; }

            db.ref('gameState').set({
                hasPet: true,
                petType: selectedType,
                petName: name,
                points: 0,
                fedCount: 0,
                growthStage: 'baby',
                stageItems: []
            });
            db.ref('petText').set("🐾 初始幼崽召唤成功！多赚积分买好吃的，可以帮它进化哦！");
        }

        function toggleRolePanel() {
            const val = document.getElementById('roleSelect').value;
            document.getElementById('teacherPanel').style.display = val === 'teacher' ? 'block' : 'none';
        }

        function commitPointsByTeacher() {
            const score = parseInt(document.getElementById('inputTeacherPoints').value) || 0;
            db.ref('gameState/points').set(score);
        }

        function wipeCloudAndRestart() {
            if (confirm("💥 确定要清空云端并完全重新格式化游戏吗？")) {
                selectedType = '';
                localDragIdx = -1;
                document.getElementById('inputPetName').value = '';
                document.getElementById('transformControls').style.display = 'none';
                currentTab = 'food';
                db.ref('gameState').set(cleanState);
                db.ref('petText').set("🔄 整个小镇百货和萌宠已被成功格式化重置！");
            }
        }

        db.ref('petText').on('value', (snapshot) => {
            if (snapshot.val() && document.getElementById('uiBubble')) {
                document.getElementById('uiBubble').innerText = snapshot.val();
            }
        });

        document.getElementById('stageCanvas').addEventListener('mousedown', (e) => {
            if (e.target.id === 'stageCanvas' || e.target.id === 'spritePet') {
                document.querySelectorAll('.draggable-item').forEach(el => el.classList.remove('active-target'));
            }
        });
    </script>
</body>
</html>
