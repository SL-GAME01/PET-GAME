<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>多人联机分布式电子宠物</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --bg-color: #f0f3f8;
            --panel-bg: #ffffff;
            --text-color: #2d3436;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* 状态栏 */
        .status-bar {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            font-weight: bold;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
        }
        .status-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .status-val { color: var(--primary-color); font-size: 1.2rem; }
        
        /* 游戏主舞台 */
        .stage {
            width: 100%;
            height: 260px;
            background: linear-gradient(to bottom, #e0f2fe, #bae6fd);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        /* 宠物样式 */
        .pet {
            width: 100px;
            height: 100px;
            position: absolute;
            bottom: 30px;
            left: calc(50% - 50px);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 70px;
        }
        /* 拟真呼吸与动画 */
        .bounce { animation: petBounce 1.5s infinite alternate ease-in-out; }
        .eating { animation: petEat 0.5s ease-in-out; }
        @keyframes petBounce {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-10px) scale(1.05, 0.95); }
        }
        @keyframes petEat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3, 0.8) rotate(5deg); }
        }
        
        /* 飘字特效 */
        .floating-text {
            position: absolute;
            color: #ff7675;
            font-weight: bold;
            font-size: 1.3rem;
            animation: floatUp 1.2s forwards ease-out;
            pointer-events: none;
            z-index: 10;
            text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
            white-space: nowrap;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-70px); }
        }

        /* 商店与背包页签 */
        .tabs { display: flex; gap: 10px; }
        .tab-btn {
            flex: 1; padding: 10px; border: none; background: #e4e7eb;
            border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .tab-btn.active { background: var(--primary-color); color: white; }
        
        .panel { display: none; background: #f8f9fa; border-radius: 16px; padding: 12px; min-height: 180px; }
        .panel.active { display: block; }

        /* 物品列表网格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
        }
        .item-card {
            background: white; border: 2px solid #e4e7eb; border-radius: 14px;
            padding: 8px; display: flex; flex-direction: column; align-items: center;
            gap: 4px; position: relative; cursor: pointer; transition: 0.2s;
        }
        .item-card:hover { transform: translateY(-2px); border-color: var(--primary-color); }
        .item-icon { font-size: 32px; }
        .item-name { font-size: 0.85rem; font-weight: bold; }
        .item-price { font-size: 0.8rem; color: #e17055; font-weight: bold; }
        .item-count {
            position: absolute; top: 4px; right: 4px; background: #6c5ce7;
            color: white; font-size: 0.75rem; padding: 2px 6px; border-radius: 10px;
        }

        /* 拖拽镜像 */
        .drag-item {
            position: fixed; font-size: 40px; pointer-events: none; z-index: 999;
            transform: translate(-50%, -50%); display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-bar">
            <div class="status-item"><span>💰 金币</span><span id="stat-coins" class="status-val">0</span></div>
            <div class="status-item"><span>🍗 投喂次数</span><span id="stat-count" class="status-val">0 / 50</span></div>
            <div class="status-item"><span>✨ 宠物积分</span><span id="stat-growth" class="status-val">0</span></div>
        </div>

        <div class="stage" id="game-stage">
            <div id="my-pet" class="pet bounce">🐣</div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('shop')">🛒 商店 (买吃的)</button>
            <button class="tab-btn" onclick="switchTab('bag')">🎒 背包 (喂宠物)</button>
        </div>

        <div id="panel-shop" class="panel active">
            <div class="grid" id="shop-grid"></div>
        </div>

        <div id="panel-bag" class="panel">
            <div class="grid" id="bag-grid"></div>
        </div>
    </div>

    <div id="drag-ghost" class="drag-item"></div>

    <script>
        // ==================== 1. 请在此处配置您的 Firebase ====================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // 初始化 Firebase
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // 为每位打开网页的学生生成/获取一个唯一标识
        let userId = localStorage.getItem('pet_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('pet_user_id', userId);
        }

        // ==================== 2. 食物与饮料数据配置（高分数） ====================
        const ITEMS = {
            // --- 饮料类 ---
            '🧃': { name: '果汁纸盒', price: 10, score: 20 },
            '🥤': { name: '冰镇可乐', price: 15, score: 25 },
            '☕': { name: '提神咖啡', price: 20, score: 35 },
            '🧋': { name: '珍珠奶茶', price: 25, score: 45 },
            '🧪': { name: '魔法药水', price: 50, score: 80 }, 

            // --- 食物类 ---
            '🍞': { name: '烤吐司', price: 10, score: 20 },
            '🍟': { name: '大份薯条', price: 15, score: 30 },
            '🍔': { name: '双层汉堡', price: 25, score: 50 },
            '🍕': { name: '至尊披萨', price: 30, score: 70 },
            '🥩': { name: '战斧牛排', price: 40, score: 90 }, 
            '🎂': { name: '豪华蛋糕', price: 50, score: 100 }  
        };

        // 玩家初始本地状态
        let playerState = {
            coins: 100,
            feedCount: 0, // 精确记录投喂次数（不管吃什么，只要吃就+1）
            growth: 0,    // 宠物累积的分数
            bag: { '🍞': 2, '🧃': 2 } 
        };

        // ==================== 3. 核心数据同步逻辑 ====================
        const userRef = db.ref('pets/' + userId);

        userRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                playerState = { ...playerState, ...data };
                if (!playerState.bag) playerState.bag = {};
                if (playerState.feedCount === undefined) playerState.feedCount = 0;
            } else {
                userRef.set(playerState);
            }
            updateUI();
        });

        // ==================== 4. 界面渲染与交互 ====================
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`panel-${tab}`).classList.add('active');
        }

        function updateUI() {
            // 更新状态栏
            document.getElementById('stat-coins').innerText = playerState.coins;
            document.getElementById('stat-count').innerText = `${playerState.feedCount} 次`;
            document.getElementById('stat-growth').innerText = `${playerState.growth} 分`;
            
            // 【形态判断判定线】严格按投喂次数走
            let stageName = '🐣 幼崽';
            let petEmoji = '🐣';
            
            if (playerState.feedCount >= 50) {
                stageName = '🐉 终极神龙';
                petEmoji = '🐉';
            } else if (playerState.feedCount >= 20) {
                stageName = '🦖 暴龙 (成年)';
                petEmoji = '🦖';
            } else if (playerState.feedCount >= 5) {
                stageName = '🐥 活泼小鸡';
                petEmoji = '🐥';
            }
            
            // 更新界面上的名字
            const statStageEl = document.getElementById('stat-stage');
            if (statStageEl.innerText !== stageName) {
                statStageEl.innerText = stageName;
                // 如果恰好踩在进化线上，加粗高亮一下提示学生
                statStageEl.style.color = (playerState.feedCount === 20 || playerState.feedCount === 50) ? '#ff7675' : '#6c5ce7';
            }
            document.getElementById('my-pet').innerText = petEmoji;

            // 渲染商店
            const shopGrid = document.getElementById('shop-grid');
            shopGrid.innerHTML = '';
            for (let emoji in ITEMS) {
                let item = ITEMS[emoji];
                shopGrid.innerHTML += `
                    <div class="item-card" onclick="buyItem('${emoji}')">
                        <div class="item-icon">${emoji}</div>
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">💰 ${item.price}</div>
                        <div style="font-size:0.7rem; color:#2ecc71; font-weight:bold;">+${item.score} 积分</div>
                    </div>
                `;
            }

            // 渲染背包
            const bagGrid = document.getElementById('bag-grid');
            bagGrid.innerHTML = '';
            let hasItems = false;
            for (let emoji in playerState.bag) {
                let count = playerState.bag[emoji];
                if (count > 0) {
                    hasItems = true;
                    bagGrid.innerHTML += `
                        <div class="item-card" data-emoji="${emoji}" style="cursor: grab;">
                            <div class="item-icon">${emoji}</div>
                            <div class="item-name">${ITEMS[emoji].name}</div>
                            <div class="item-count">x${count}</div>
                        </div>
                    `;
                }
            }
            if (!hasItems) {
                bagGrid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#aaa; padding:20px;">背包空空如也，快去商店买吃的吧！</div>';
            }

            setupDragEvents();
        }

        // 购买逻辑
        function buyItem(emoji) {
            let cost = ITEMS[emoji].price;
            if (playerState.coins >= cost) {
                playerState.coins -= cost;
                playerState.bag[emoji] = (playerState.bag[emoji] || 0) + 1;
                userRef.set(playerState);
            } else {
                alert("金币不够啦！请认真回答老师的数学提问来换取金币 💰");
            }
        }

        // ==================== 5. 拖拽喂食交互 ====================
        const ghost = document.getElementById('drag-ghost');
        const petEl = document.getElementById('my-pet');
        let activeEmoji = null;

        function setupDragEvents() {
            document.querySelectorAll('#bag-grid .item-card').forEach(card => {
                card.addEventListener('mousedown', (e) => startDrag(e, card.dataset.emoji));
                card.addEventListener('touchstart', (e) => startDrag(e.touches[0], card.dataset.emoji), {passive: true});
            });
        }

        function startDrag(e, emoji) {
            activeEmoji = emoji;
            ghost.innerText = emoji;
            ghost.style.display = 'block';
            moveGhost(e);

            const moveHandler = (evt) => {
                let touch = evt.touches ? evt.touches[0] : evt;
                moveGhost(touch);
            };

            const endHandler = (evt) => {
                document.removeEventListener('mousemove', moveHandler);
                document.removeEventListener('mouseup', endHandler);
                document.removeEventListener('touchmove', moveHandler);
                document.removeEventListener('touchend', endHandler);
                ghost.style.display = 'none';

                let finalX = evt.changedTouches ? evt.changedTouches[0].clientX : evt.clientX;
                let finalY = evt.changedTouches ? evt.changedTouches[0].clientY : evt.clientY;
                
                checkFeedSuccess(finalX, finalY);
            };

            document.addEventListener('mousemove', moveHandler);
            document.addEventListener('mouseup', endHandler);
            document.addEventListener('touchmove', moveHandler, {passive: false});
            document.addEventListener('touchend', endHandler);
        }

        function moveGhost(e) {
            ghost.style.left = e.clientX + 'px';
            ghost.style.top = e.clientY + 'px';
        }

        // 判定喂食
        function checkFeedSuccess(x, y) {
            const petRect = petEl.getBoundingClientRect();
            if (x >= petRect.left && x <= petRect.right && y >= petRect.top && y <= petRect.bottom) {
                if (playerState.bag[activeEmoji] > 0) {
                    playerState.bag[activeEmoji]--;
                    
                    // 🌟 修正核心：不管喂什么，喂食次数严格 +1
                    playerState.feedCount += 1;
                    
                    // 积分按食物配置独立叠加
                    let addedScore = ITEMS[activeEmoji].score;
                    playerState.growth += addedScore;
                    
                    // 同步数据
                    userRef.set(playerState);

                    // 动画与飘字（飘字显示：投喂次数增加及积分增加）
                    petEl.classList.remove('bounce');
                    petEl.classList.add('eating');
                    createFloatingText(`次数+1 (共${playerState.feedCount}次) | 积分+${addedScore}`, x, y);
                    
                    setTimeout(() => {
                        petEl.classList.remove('eating');
                        petEl.classList.add('bounce');
                    }, 500);
                }
            }
        }

        // 飘字特效
        function createFloatingText(text, x, y) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = (x - 60) + 'px';
            el.style.top = (y - 40) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }
    </script>
</body>
</html>
